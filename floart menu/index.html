<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2035">
<title>FLOART — Choose Language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2035;--cream:#f7f0df;--paper:#fffaf0;--gold:#b9985a;--gold2:#e0c78d;--ink:#172a3b;--muted:#6f756f;--line:rgba(185,152,90,.42)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif;padding:24px}
body:before{content:"";position:fixed;inset:10px;pointer-events:none;border:1px solid var(--line)}
.topline{position:fixed;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--navy),var(--gold2),var(--navy))}
.panel{position:relative;width:min(100%,620px);padding:clamp(32px,7vw,62px) 24px;text-align:center;background:var(--navy);color:var(--paper);border:1px solid var(--gold);box-shadow:0 18px 48px #05162620}
.panel:before{content:"";position:absolute;inset:10px;border:1px solid #e0c78d35;pointer-events:none}
.eyebrow{font-size:.67rem;text-transform:uppercase;letter-spacing:.3em;color:var(--gold2);font-weight:700}
h1{font-family:"Cormorant Garamond",serif;font-size:clamp(4rem,13vw,6.8rem);line-height:.95;letter-spacing:.1em;font-weight:600;color:#fff4dc;margin:20px 0 8px}
.sub{font-size:.72rem;text-transform:uppercase;letter-spacing:.32em;color:var(--gold2)}
.wave{font-size:2rem;color:var(--gold2);margin:20px 0 10px}
p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(1.35rem,4vw,1.8rem);color:#f4e6c6;margin:0 0 28px}
.languages{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
a{min-width:170px;padding:15px 22px;text-decoration:none;text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;font-weight:700;border:1px solid var(--gold);transition:transform .2s,background .2s}
a:hover{transform:translateY(-3px)}
.primary{background:var(--gold2);color:var(--navy);border-color:var(--gold2)}
.secondary{color:var(--gold2);background:transparent}
.note{font-family:"DM Sans",sans-serif;font-style:normal;font-size:.7rem;letter-spacing:.13em;color:#b5c0c5;margin:28px 0 0}
@media(max-width:430px){a{width:100%;max-width:260px}.eyebrow{font-size:.58rem;letter-spacing:.2em}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topline"></div>
<main class="panel">
  <div class="eyebrow">Restaurant · Seafood · Experience</div>
  <h1>FLOART</h1>
  <div class="sub">Seafood Restaurant</div>
  <div class="wave" aria-hidden="true">〜</div>
  <p>Choose your language</p>
  <nav class="languages" aria-label="Choose language">
    <a class="primary" href="floart_menu_english.html">English</a>
    <a class="secondary" href="floart_menu_shqip.html">Shqip</a>
  </nav>
  <div class="note">SEAFOOD · PASTA · MOMENTS TO REMEMBER</div>
</main>
</body>
</html>
